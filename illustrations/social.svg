<svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Lucretius, De Rerum Natura: title beside a medallion of Venus and Mars (the poem's opening), on Pompeian red.">
  <!-- The link-preview card (docs/social.jpg), the companion of the Iliad's:
       same layout as iliad/docs/social.jpg, with the cover's type and medallion
       (illustrations/cover.svg). Rendered by headless Chrome. -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a1a14"/>
      <stop offset="1" stop-color="#2e0c0b"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0404" stop-opacity="0.45"/>
    </radialGradient>
    <pattern id="meander" width="30" height="30" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#efe6d2" stroke-width="2.8">
        <path d="M0 4 H30"/>
        <path d="M0 26 H30"/>
        <path d="M21 26 V8 H8 V20 H14"/>
      </g>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <clipPath id="medallion-clip">
      <circle cx="900" cy="315" r="210"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#red)"/>
  <rect width="1200" height="630" fill="#efe6d2" filter="url(#grain)"/>
  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- frame and key bands -->
  <rect x="14" y="14" width="1172" height="602" fill="none" stroke="#efe6d2" stroke-width="2" opacity="0.85"/>
  <rect x="80" y="32" width="1040" height="30" fill="url(#meander)"/>
  <rect x="80" y="566" width="1040" height="30" fill="url(#meander)"/>

  <!-- title block -->
  <g font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" text-anchor="middle" fill="#efe6d2">
    <text x="345" y="178" font-size="24" font-style="italic" opacity="0.75">Aeneadum genetrix</text>
    <text x="345" y="240" font-size="40" textLength="300" lengthAdjust="spacingAndGlyphs">LUCRETIUS&#8217;</text>
    <text x="345" y="308" font-size="62" textLength="460" lengthAdjust="spacingAndGlyphs">DE RERUM</text>
    <text x="345" y="372" font-size="62" textLength="380" lengthAdjust="spacingAndGlyphs">NATURA</text>
    <line x1="215" y1="394" x2="475" y2="394" stroke="#d6a64a" stroke-width="1.4"/>
    <text x="345" y="428" font-size="22" fill="#d6a64a" letter-spacing="3">ON THE NATURE OF THINGS</text>
    <text x="345" y="470" font-size="16" letter-spacing="1.5" fill-opacity="0.85">LINE FOR LINE TRANSLATION BY FABLE 5.1</text>
    <text x="345" y="500" font-size="15" font-style="italic" opacity="0.65">6 books &#183; 7,412 lines from the Latin &#183; Machiavelli&#8217;s margin</text>
  </g>

  <!-- medallion -->
  <image href="cover_medallion.jpg" x="690" y="105" width="420" height="420" clip-path="url(#medallion-clip)"/>
  <circle cx="900" cy="315" r="212" fill="none" stroke="#efe6d2" stroke-width="3.4"/>
  <circle cx="900" cy="315" r="205" fill="none" stroke="#efe6d2" stroke-width="1.3" opacity="0.75"/>
</svg>
